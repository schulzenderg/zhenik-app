<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Женик TL1000 - Тест Панели</title>
    <!-- Официальный скрипт Telegram -->
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--tg-theme-bg-color, #f5f5f7);
            color: var(--tg-theme-text-color, #000000);
            margin: 0; padding: 15px; text-align: center;
        }
        h2 { color: #ff4d6d; margin: 10px 0; }
        .tabs { display: flex; justify-content: space-around; margin-bottom: 15px; }
        .tab-btn {
            background: #e0e0e0; border: none; padding: 10px 20px;
            border-radius: 20px; font-weight: bold; cursor: pointer; flex: 1; margin: 0 5px;
        }
        .tab-btn.active { background: #ff4d6d; color: white; }
        .panel { display: none; }
        .panel.active { display: block; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .card {
            background: var(--tg-theme-secondary-bg-color, #ffffff);
            border-radius: 12px; padding: 15px 5px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05); cursor: pointer;
        }
        .slot-machine {
            background: #333; color: white; padding: 20px; border-radius: 15px;
            margin: 20px auto; max-width: 280px;
        }
        .slots { display: flex; justify-content: center; font-size: 40px; margin-bottom: 15px; background: #222; padding: 10px; border-radius: 10px; letter-spacing: 10px; }
        .spin-btn {
            background: #ff4d6d; color: white; border: none; padding: 10px 30px;
            font-size: 18px; border-radius: 25px; cursor: pointer; font-weight: bold;
        }
        .spin-btn:disabled { background: #555; }
        .balance { font-size: 18px; font-weight: bold; margin-bottom: 10px; }
    </style>
</head>
<body>

    <h2>Женик TL1000 🦾</h2>
    
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('coupons')">🎫 Купоны</button>
        <button class="tab-btn" onclick="switchTab('casino')">🎰 Казино</button>
    </div>

    <!-- ВКЛАДКА КУПОНОВ -->
    <div id="coupons-panel" class="panel active">
        <div class="grid">
            <div class="card" onclick="sendAction('coupon_завтрак')"><div style="font-size:24px">☕️</div><b>Завтрак в постель</b></div>
            <div class="card" onclick="sendAction('coupon_массаж')"><div style="font-size:24px">💆‍♂️</div><b>Массаж</b></div>
            <div class="card" onclick="sendAction('coupon_вкусняшка')"><div style="font-size:24px">🍦</div><b>Любая вкусняшка</b></div>
            <div class="card" onclick="sendAction('coupon_кино')"><div style="font-size:24px">🎬</div><b>Кино на выбор</b></div>
            <div class="card" onclick="sendAction('coupon_букет')"><div style="font-size:24px">💐</div><b>Букет без повода</b></div>
            <div class="card" onclick="sendAction('coupon_свидание')"><div style="font-size:24px">✨</div><b>Свидание-сюрприз</b></div>
        </div>
    </div>

    <!-- ВКЛАДКА КАЗИНО -->
    <div id="casino-panel" class="panel">
        <div class="balance">💰 Баланс: <span id="bal-val">1000</span> Лав-коинов</div>
        
        <div class="slot-machine">
            <div class="slots" id="slot-screen">🍒🍒🍒</div>
            <button class="spin-btn" id="spin-id" onclick="spinSlots()">КРУТИТЬ (-100)</button>
        </div>
        <div id="slot-result" style="font-weight:bold; min-height:20px;"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready(); tg.expand();

        let balance = 1000;
        const items = ['🍒', '🍋', '💎', '❤️', '🎰'];

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            if(tab === 'coupons') {
                document.querySelector('.tab-btn:nth-child(1)').classList.add('active');
                document.getElementById('coupons-panel').classList.add('active');
            } else {
                document.querySelector('.tab-btn:nth-child(2)').classList.add('active');
                document.getElementById('casino-panel').classList.add('active');
            }
        }

        function sendAction(data) {
            tg.sendData(data); // Отправляем выбор обратно в чат
            tg.close();
        }

        function spinSlots() {
            if (balance < 100) {
                document.getElementById('slot-result').innerText = "❌ Недостаточно средств!";
                return;
            }
            balance -= 100;
            document.getElementById('bal-val').innerText = balance;
            document.getElementById('spin-id').disabled = true;
            document.getElementById('slot-result').innerText = "🎰 Крутим...";

            let ticks = 0;
            let interval = setInterval(() => {
                let r1 = items[Math.floor(Math.random()*items.length)];
                let r2 = items[Math.floor(Math.random()*items.length)];
                let r3 = items[Math.floor(Math.random()*items.length)];
                document.getElementById('slot-screen').innerText = r1 + r2 + r3;
                ticks++;
                
                if(ticks > 10) {
                    clearInterval(interval);
                    document.getElementById('spin-id').disabled = false;
                    
                    if(r1 === r2 && r2 === r3) {
                        balance += 500;
                        document.getElementById('bal-val').innerText = balance;
                        document.getElementById('slot-result').innerText = "🎉 ДЖЕКПОТ! +500 коинов!";
                        tg.sendData("casino_jackpot");
                    } else if(r1 === r2 || r2 === r3 || r1 === r3) {
                        balance += 150;
                        document.getElementById('bal-val').innerText = balance;
                        document.getElementById('slot-result').innerText = "💵 Малый выигрыш! +150 коинов!";
                    } else {
                        document.getElementById('slot-result').innerText = "😢 Попробуй еще раз!";
                    }
                }
            }, 100);
        }
    </script>
</body>
</html>
